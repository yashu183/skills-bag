schema_version: "1.1"
name: redesign-signup-form-in-app-controls
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A versioned mock .ui-tweak/<slug>/v1.html shows the current form and at least two redesign directions. The plan and date fields are drawn as the app's own Select (rounded-lg trigger with chevron, custom list) and DatePicker (calendar popover) components, not a native <select> or <input type=date>, and check_native.py reports no unacknowledged native controls on v1.html. src/ is unchanged, a preview URL is given, and the agent asks for feedback before implementing.
